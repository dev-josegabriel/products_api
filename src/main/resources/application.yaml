server:
  port: 8082

spring:
  application:
    name: productAPI

  datasource:
    url: jdbc:postgresql://localhost:5432/product_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      hibernate:
        format_sql: true